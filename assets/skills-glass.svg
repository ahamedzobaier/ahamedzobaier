<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.0)" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, Roboto, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #ffffff; }
    .skill-text { font-family: 'Segoe UI', -apple-system, Roboto, Helvetica, sans-serif; font-size: 16px; font-weight: 600; fill: #e2e8f0; }
    .section-title { font-family: 'Segoe UI', -apple-system, Roboto, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #94a3b8; letter-spacing: 1px; text-transform: uppercase; }
    
    @media (prefers-color-scheme: light) {
      .title { fill: #0f172a; }
      .skill-text { fill: #334155; }
      .section-title { fill: #64748b; }
      #glassFill stop:nth-child(1) { stop-color: rgba(0, 0, 0, 0.05); }
      #glassFill stop:nth-child(2) { stop-color: rgba(0, 0, 0, 0.01); }
      #glassStroke stop:nth-child(1) { stop-color: rgba(0, 0, 0, 0.1); }
    }
    @media (prefers-color-scheme: dark) {
      .bg-rect { fill: transparent; }
    }
  </style>

  <rect class="bg-rect" width="100%" height="100%" fill="transparent" />

  <!-- Glowing Orbs behind the glass -->
  <circle cx="150" cy="150" r="100" fill="#00f0ff" filter="url(#glow)" opacity="0.25" />
  <circle cx="650" cy="350" r="120" fill="#ff007f" filter="url(#glow)" opacity="0.25" />
  <circle cx="400" cy="250" r="90" fill="#7a00ff" filter="url(#glow)" opacity="0.2" />

  <!-- Language & Frameworks Title -->
  <text x="20" y="30" class="section-title">Languages &amp; Frameworks</text>

  <!-- Card 1: Java -->
  <g transform="translate(20, 50)" filter="url(#dropShadow)">
    <rect width="240" height="70" rx="12" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5" />
    <image href="https://cdn.simpleicons.org/java/ED8B00" x="20" y="15" width="40" height="40" />
    <text x="80" y="42" class="skill-text">Java</text>
  </g>

  <!-- Card 2: Spring Boot -->
  <g transform="translate(280, 50)" filter="url(#dropShadow)">
    <rect width="240" height="70" rx="12" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5" />
    <image href="https://cdn.simpleicons.org/springboot/6DB33F" x="20" y="15" width="40" height="40" />
    <text x="80" y="42" class="skill-text">Spring Boot</text>
  </g>

  <!-- Card 3: Spring Security -->
  <g transform="translate(540, 50)" filter="url(#dropShadow)">
    <rect width="240" height="70" rx="12" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5" />
    <image href="https://cdn.simpleicons.org/springsecurity/6DB33F" x="20" y="15" width="40" height="40" />
    <text x="80" y="42" class="skill-text">Spring Security</text>
  </g>

  <!-- Card 4: Hibernate -->
  <g transform="translate(20, 140)" filter="url(#dropShadow)">
    <rect width="240" height="70" rx="12" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5" />
    <image href="https://cdn.simpleicons.org/hibernate/59666C" x="20" y="15" width="40" height="40" />
    <text x="80" y="42" class="skill-text">Hibernate</text>
  </g>

  <!-- Databases & Tools Title -->
  <text x="20" y="250" class="section-title">Databases &amp; Tools</text>

  <!-- Card 5: PostgreSQL -->
  <g transform="translate(20, 270)" filter="url(#dropShadow)">
    <rect width="240" height="70" rx="12" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5" />
    <image href="https://cdn.simpleicons.org/postgresql/4169E1" x="20" y="15" width="40" height="40" />
    <text x="80" y="42" class="skill-text">PostgreSQL</text>
  </g>

  <!-- Card 6: MySQL -->
  <g transform="translate(280, 270)" filter="url(#dropShadow)">
    <rect width="240" height="70" rx="12" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5" />
    <image href="https://cdn.simpleicons.org/mysql/4479A1" x="20" y="15" width="40" height="40" />
    <text x="80" y="42" class="skill-text">MySQL</text>
  </g>

  <!-- Card 7: Docker -->
  <g transform="translate(540, 270)" filter="url(#dropShadow)">
    <rect width="240" height="70" rx="12" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5" />
    <image href="https://cdn.simpleicons.org/docker/2496ED" x="20" y="15" width="40" height="40" />
    <text x="80" y="42" class="skill-text">Docker</text>
  </g>

  <!-- Card 8: Git -->
  <g transform="translate(20, 360)" filter="url(#dropShadow)">
    <rect width="240" height="70" rx="12" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5" />
    <image href="https://cdn.simpleicons.org/git/F05032" x="20" y="15" width="40" height="40" />
    <text x="80" y="42" class="skill-text">Git</text>
  </g>

  <!-- Card 9: Maven -->
  <g transform="translate(280, 360)" filter="url(#dropShadow)">
    <rect width="240" height="70" rx="12" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.5" />
    <image href="https://cdn.simpleicons.org/apachemaven/C71A36" x="20" y="15" width="40" height="40" />
    <text x="80" y="42" class="skill-text">Maven</text>
  </g>

</svg>
